[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "genome-normalizer"
version = "0.2.0"
description = "Local genotype normalization for sibling IBD analysis and targeted SNP predisposition panels"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pandas>=2.0",
  "pyliftover>=0.4",
]

[project.scripts]
genome-normalizer = "dna_tools.cli:main"

[tool.setuptools.packages.find]
include = ["dna_tools*", "app*"]
namespaces = true
